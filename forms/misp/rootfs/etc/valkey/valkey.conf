# Valkey for the misp form: valkey's own file, with loopback TCP, as
# MISP's image cannot reach the socket. No password: the port is
# loopback, and only MISP's leash connects. leash starts it
# (etc/sv/valkey/service) as the valkey user.

daemonize no
supervised no
logfile ""
loglevel notice

port 6379
bind 127.0.0.1
unixsocket /run/svc/valkey/valkey.sock
unixsocketperm 660
protected-mode yes

maxmemory 192mb
maxmemory-policy noeviction

dir /data/svc/valkey
dbfilename dump.rdb
save 3600 1 300 100 60 10000
appendonly no

enable-module-command no
enable-debug-command no
enable-protected-configs no

user default on nopass ~* &* +@all -@admin
